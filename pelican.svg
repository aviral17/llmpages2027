<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Pelican body -->
  <circle cx="100" cy="80" r="50" fill="#f9d71c" stroke="#333" stroke-width="4" />
  <!-- Beak -->
  <polygon points="150,80 180,70 150,90" fill="#f4a261" />
  <!-- Wings -->
  <polyline points="70,80 50,60 70,40" fill="none" stroke="#555" stroke-width="4" />
  <polyline points="130,70 150,50 130,30" fill="none" stroke="#555" stroke-width="4" />
  <!-- Bicycle wheels -->
  <circle cx="70" cy="150" r="20" fill="#555" />
  <circle cx="130" cy="150" r="20" fill="#555" />
  <!-- Bicycle frame -->
  <line x1="70" y1="150" x2="70" y2="130" stroke="#222" stroke-width="2" />
  <line x1="130" y1="150" x2="130" y2="130" stroke="#222" stroke-width="2" />
  <line x1="70" y1="130" x2="130" y2="130" stroke="#222" stroke-width="2" />
  <line x1="70" y1="150" x2="130" y2="150" stroke="#222" stroke-width="2" />
</svg>